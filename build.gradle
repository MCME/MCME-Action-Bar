import groovy.json.JsonOutput

import java.nio.file.Paths

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
}

group = 'com.mcmiddleearth'
version = '1.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly files(Paths.get(System.getProperty('user.home'), "MCME", "dev", "jars", "VentureChat.jar"))
}

// Dynamically adding the version to the paper plugin.yml
processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Replace the normal gradle build with shadowJar
// prevents the non fat JAR from ever being built
jar {
    enabled = false
}

shadowJar {
    archiveClassifier = "" // Removes -all from the end of the generated JAR
}

// https://docs.gradle.org/current/dsl/org.gradle.api.plugins.JavaPluginExtension.html
def targetJavaVersion = 25
java {
    toolchain {
        // Intellij should pick this up
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks {
    runServer {
        minecraftVersion("26.2")
    }
}

tasks.register('generateFontJson') {
    group = 'resourcepack'
    description = 'Generates default.json from hud-elements.groovy (computes ascents automatically)'

    def manifest = file('resourcepack/hud-elements.groovy')
    def output = file('resourcepack/assets/minecraft/font/default.json')

    inputs.file(manifest)
    outputs.file(output)

    doLast {
        def config = new ConfigSlurper().parse(manifest.toURI().toURL())
        def providers = []

        def negativeSpaces = [:]

        // HUD elements — ascent computed from elementId, no manual formula needed
        config.hudElements.each { element ->
            int elementId = element.elementId
            int ascent = -(((elementId + 1024) << 13) + 4095)
            int height = (element.height ?: 8) as int
            def advances = [] as Set
            element.glyphs.each { glyph ->
                def provider = [type: 'bitmap', file: glyph.image, ascent: ascent, chars: [glyph['char']]]
                if (element.height) provider.height = height
                providers << provider
                advances << glyphAdvance(glyph.image as String, height)
            }

            // Each element is followed by a negative space that cancels its glyph's advance, so the
            // action bar string always has zero width and elements never shift each other
            if (advances.size() != 1) {
                throw new GradleException("HUD element ${elementId}: all glyphs must have the same advance, got ${advances}")
            }
            String negativeSpaceChar = new String(Character.toChars(0xF000 + elementId))
            negativeSpaces[negativeSpaceChar] = -advances.first()
            println "Element ${elementId}: advance ${advances.first()}"
        }

        providers << [type: 'space', advances: negativeSpaces]

        output.text = JsonOutput.prettyPrint(
                JsonOutput.toJson([providers: providers])
        )
        println "Generated ${output} (${providers.size()} providers)"
    }
}

// Mirrors Minecraft's BitmapProvider: the advance is the rightmost non-transparent column,
// scaled to the glyph height, rounded, plus 1px spacing
int glyphAdvance(String resourceLocation, int height) {
    def (namespace, path) = resourceLocation.split(':')
    def image = javax.imageio.ImageIO.read(file("resourcepack/assets/${namespace}/textures/${path}"))
    int actualWidth = 0
    for (int x = image.width - 1; x >= 0 && actualWidth == 0; x--) {
        for (int y = 0; y < image.height; y++) {
            if ((image.getRGB(x, y) >>> 24) != 0) {
                actualWidth = x + 1
                break
            }
        }
    }
    return (int) (0.5d + actualWidth * (height / (float) image.height)) + 1
}
