import groovy.json.JsonOutput

import java.nio.file.Paths

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = 'com.mcmiddleearth'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    compileOnly files(Paths.get(System.getProperty('user.home'), "MCME", "dev", "jars", "VentureChat.jar"))
}

// Dynamically adding the version to the paper plugin.yml
processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}


// Replace the normal gradle build with shadowJar
// prevents the non fat JAR from ever being built
jar {
    enabled = false
}

shadowJar {
    archiveClassifier = "" // Removes -all from the end of the generated JAR
}

// https://docs.gradle.org/current/dsl/org.gradle.api.plugins.JavaPluginExtension.html
def targetJavaVersion = 21
java {
    toolchain {
        // Intellij should pick this up
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

tasks.register('generateFontJson') {
    group = 'resourcepack'
    description = 'Generates default.json from hud-elements.groovy (computes ascents automatically)'

    def manifest = file('resourcepack/hud-elements.groovy')
    def output = file('resourcepack/assets/minecraft/font/default.json')

    inputs.file(manifest)
    outputs.file(output)

    doLast {
        def config = new ConfigSlurper().parse(manifest.toURI().toURL())
        def providers = []

        // HUD elements — ascent computed from elementId, no manual formula needed
        config.hudElements.each { element ->
            int elementId = element.elementId
            int ascent = -(((elementId + 1024) << 13) + 4095)
            element.glyphs.each { glyph ->
                def provider = [type: 'bitmap', file: glyph.image, ascent: ascent, chars: [glyph['char']]]
                if (element.height) provider.height = element.height as int
                providers << provider
            }
        }

        output.text = JsonOutput.prettyPrint(
                JsonOutput.toJson([providers: providers])
        )
        println "Generated ${output} (${providers.size()} providers)"
    }
}
